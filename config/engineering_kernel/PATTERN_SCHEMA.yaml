schema:
  id: pattern
  version: "0.1"

required:

  pattern_id:
    type: string

  name:
    type: string

  problem:
    type: string

  solution:
    type: string

  domain:
    type: string

  status:
    type: enum
    values:
      - candidate
      - proven
      - deprecated

  created:
    type: date

  updated:
    type: date

  tags:
    type: list[string]

  related_projects:
    type: list[string]

  related_knowledge:
    type: list[string]

  anti_patterns:
    type: list[string]

  notes:
    type: string
